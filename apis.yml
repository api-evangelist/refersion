  - type: Webhooks
    url: asyncapi/refersion-webhooks.yml
- aid: refersion:refersion-order-tracking-api
  name: Refersion Order Tracking API
  description: >-
    Inbound order-reporting surface used to send completed orders to Refersion so commissions are
    calculated. Server-side integrations POST the order JSON plus a merchant-generated cart_id to
    inbound-webhooks.refersion.com, authenticated with the same public/secret key pair as the REST
    API; the browser half is handled by the refersion.js tracking library. Refersion publishes no
    OpenAPI for this surface.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.refersion.dev/reference/webhook-tracking
  baseURL: https://inbound-webhooks.refersion.com
