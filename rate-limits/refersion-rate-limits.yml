name: Refersion Rate Limits
description: >-
  Rate-limiting posture for the Refersion REST and GraphQL APIs. Refersion publishes NO
  request-rate limit — no requests-per-second, no requests-per-minute, no daily quota — for any
  surface, and returns NO rate-limit response headers. What the contract DOES declare is a set of
  hard payload-size caps, and it signals one of them with HTTP 429, which is the single most
  misleading thing about this API's throttling behaviour: a 429 from Refersion means "your array is
  too big", not "slow down", so an exponential-backoff retry of the identical request will fail
  forever.
