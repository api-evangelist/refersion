name: Refersion Packages
description: >-
  Client-library inventory for Refersion. Refersion publishes NO first-party server-side SDK in any
  public package registry — npm, PyPI, RubyGems, Packagist, crates.io, NuGet and Maven Central all
  return zero first-party results, and the github.com/refersion organization exists (id 32423452)
  but exposes zero public repositories. The only first-party distributed client is the browser
  tracking library refersion.js, served unversioned from Refersion's own CloudFront/S3 CDN. Two
  third-party packages exist and are marked official:false.
