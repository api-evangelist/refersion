gaps:
- >-
  No first-party SDK exists for any server-side language, so every integration against the REST API
  documented at https://www.refersion.dev is hand-rolled HTTP with Refersion-Public-Key and
  Refersion-Secret-Key headers.
- >-
  github.com/refersion has zero public repositories, so there is no source-available client, sample
  app, or Postman collection published by the vendor.
- >-
  refersion.js ships unpinned with no Subresource Integrity attribute in the documented snippet.
