implementation_notes:
- >-
  Every tool inherits its inputSchema verbatim from the corresponding operation's requestBody in
  openapi/_original/refersion-rest-api-readme-harvest.json. No parameter here is invented.
- >-
  A server MUST NOT treat HTTP 200 as success on edit_affiliate, affiliate_status_change,
  status_change or new_sku_commission — inspect ids_changed / ids_not_changed / duplicate_not_added
  and surface partial failure to the agent. See errors/refersion-problem-types.yml.
- >-
  A server MUST NOT treat HTTP 204 as success. Refersion returns 204 with a validation-error body.
- >-
  There is no idempotency key. Retrying credit_commission double-credits an affiliate. Any server
  exposing it to an autonomous agent should gate it behind human confirmation — see
  agentic-access/refersion-agentic-access.yml.
