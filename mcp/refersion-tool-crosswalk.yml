event_only:
- surface: webhook
  topics:
  - New Payment
  - Bonus Tier Movement
  reason: >-
    Payments and bonus-tier rewards have NO REST operation and therefore no possible tool binding.
    They are observable only by receiving the corresponding webhook. An agent asked "what did we pay
    this affiliate" cannot answer it from the API.
  detail: asyncapi/refersion-webhooks.yml
