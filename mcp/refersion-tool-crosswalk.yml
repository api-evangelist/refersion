name: Refersion Tool Crosswalk
description: >-
  Binding of every candidate MCP tool to the REST operation that backs it, so an agent knows
  exactly which published operation a tool call becomes and which parameters it inherits. Confidence
  is `high` throughout because the tool list was derived one-to-one FROM the OpenAPI rather than
  discovered from a shipped server — there is no naming ambiguity to resolve. What is NOT high
  confidence is the GraphQL column: Refersion's /graphql endpoint returns HTTP 403 to anonymous
  introspection, so field names are taken from the conceptual SDL in graphql/ and are marked
  accordingly.
surfaces:
  openapi:
    path: openapi/_original/refersion-rest-api-readme-harvest.json
    refined:
    - openapi/refersion-affiliates-api-openapi.yml
    - openapi/refersion-conversions-api-openapi.yml
    - openapi/refersion-offers-api-openapi.yml
    - openapi/refersion-reporting-api-openapi.yml
    base_url: https://api.refersion.com/v2
    gated: false
    note: >-
      The spec is published only as per-operation JSON embedded in each ReadMe reference page;
      there is no single downloadable spec URL.
  graphql:
    endpoint: https://api.refersion.com/graphql
    gated: true
    http_status: 403
    checked: '2026-08-13'
    note: >-
      Anonymous POST of {__schema{queryType{name}}} returns {"message":"Forbidden"}. Field names in
      the crosswalk below come from the conceptual SDL and require authenticated introspection to
      confirm.
  mcp:
    url: null
    gated: false
    exists: false
    note: No MCP server is published by Refersion. See mcp/refersion-mcp.yml.
